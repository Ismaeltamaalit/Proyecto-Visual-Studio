<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ejercicio 1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        font-family: system-ui, sans-serif;
      }
      .wrap {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 12px;
        align-items: start;
      }
      ul {
        min-height: 140px;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 8px;
        margin: 0;
      }
      li {
        list-style: none;
        padding: 6px;
        border-radius: 6px;
        cursor: pointer;
      }
      li.seleccionado {
        background: #efefef;
      }
      .controls {
        display: grid;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <ul id="origen">
        <li class="elemento" >Marcos</li>
        <li class="elemento">Laura</li>
        <li class="elemento">Antonio</li>
        <li class="elemento">Luis</li>
        <li class="elemento">Marta</li>
      </ul>

      <div class="controls">
        <button id="btnRight">→</button>
        <button id="btnLeft">←</button>
        <button id="btnUndo">Deshacer</button>
      </div>

      <ul id="destino"></ul>
    </div>

    <script src="">
      
       


    </script>
  </body>
</html>
