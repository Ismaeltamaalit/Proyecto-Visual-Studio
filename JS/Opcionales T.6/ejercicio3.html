<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       const div = document.querySelector('div');
const nuevoAntes = document.createElement('p');
nuevoAntes.textContent = 'Elemento Anterior';
const nuevoDespues = document.createElement('p');
nuevoDespues.textContent = 'Elemento Posterior';

div.before(nuevoAntes);
div.after(nuevoDespues); 
    </script>
</body>
</html>
