<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Actividad 3</title></head>
<body>
<div id="datos"></div>
<script>
const xhr=new XMLHttpRequest();
xhr.open("GET","703.json");
xhr.onload=()=>{
 const p=JSON.parse(xhr.responseText);
 datos.innerHTML=`<p>Nombre: ${p.nombre}</p><p>Edad: ${p.edad}</p><p>Email: ${p.email}</p>`;
};
xhr.send();
</script>
</body></html>
