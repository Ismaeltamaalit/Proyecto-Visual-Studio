<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIDAD 6 - ACTIVIDAD 4</title>
</head>

<body>
    <h1>Lista de elementos</h1>
    <form id="formulario">
      <input type="text" id="textoInput" placeholder="Introducir un elemento">
      <button type="button" id="btnEnviar">Agregar</button>
    </form>
    <ul id="lista">
    </ul>
  <script>
    
document.getElementById('btnEnviar').addEventListener('click', () => {
    const input = document.getElementById('textoInput');
    if (input.value.trim() !== "") {
        const nuevoLi = document.createElement('li');
        nuevoLi.textContent = input.value;
        document.getElementById('lista').appendChild(nuevoLi);
        input.value = "";
    }
});
  </script>
</body>

</html>
