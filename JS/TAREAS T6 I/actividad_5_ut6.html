<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIDAD 6 - ACTIVIDAD 5</title>

    <style>
        td {
            padding: 10px;
            border: 1px solid black;
            cursor: pointer;
        }

        .resaltado {
            background-color: lightgray;
        }
    </style>
</head>

<body>
    <h1>Tabla de datos</h1>
    <table id="tabla">
        <tr>
            <td>1-1</td>
            <td>1-2</td>
            <td>1-3</td>
        </tr>
        <tr>
            <td>2-1</td>
            <td>2-2</td>
            <td>2-3</td>
        </tr>
        <tr>
            <td>3-1</td>
            <td>3-2</td>
            <td>3-3</td>
        </tr>
    </table>

    <p id="resultado"></p>
<script>
document.getElementById('tabla').addEventListener('click', (e) => {
    if (e.target.tagName === 'TD') {
        
        document.querySelectorAll('td').forEach(td => td.classList.remove('resaltado'));
        
        e.target.classList.add('resaltado');
        const fila = e.target.parentElement.rowIndex + 1;
        const columna = e.target.cellIndex + 1;
        document.getElementById('resultado').textContent = `Fila: ${fila}, Columna: ${columna}`;
    }
});
</script>
</body>

</html>
