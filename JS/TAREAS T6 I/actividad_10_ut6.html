<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <title> EXAMEN </title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 14px;
        }

        #cuerpo {
            margin-bottom: 20px;
        }

        .check {
            padding: 10px;
            width: 3%;
        }

        .codigo {
            border: 1px solid black;
            padding: 10px;
            width: 30%;
        }

        .nombre {
            border: 1px solid black;
            padding: 10px;
            width: 50%;
        }

        table {
            border-collapse: collapse;
            width: 95%;
            margin: 20px;
        }
    </style>

</head>

<body>
    <h1>Creando una tabla</h1>
    <input type="text" id="codigo">
    <input type="text" id="nombre">
    <button onclick="anadir()">Añadir</button>
    <div id="cuerpo">
        <table id="tabla">
            <thead>
                <tr>
                    <th>Sel</th>
                    <th>Código</th>
                    <th>Nombre</th>
                </tr>
            </thead>
        </table>
    </div>
    <button onclick="borrar()">Borrar</button>
    <button onclick="mostrar()">Mostrar</button>
<script>
    
function anadir() {
    const codigo = document.getElementById('codigo').value;
    const nombre = document.getElementById('nombre').value;
    const tabla = document.getElementById('tabla');

    if (codigo && nombre) {
        const fila = tabla.insertRow();
        fila.innerHTML = `
            <td><input type="checkbox" class="sel-check"></td>
            <td>${codigo}</td>
            <td>${nombre}</td>
        `;
    }
}

function borrar() {
    const checks = document.querySelectorAll('.sel-check');
    checks.forEach(check => {
        if (check.checked) {
            check.closest('tr').remove();
        }
    });
}

function mostrar() {
    const checks = document.querySelectorAll('.sel-check');
    checks.forEach(check => {
        if (check.checked) {
            const fila = check.closest('tr');
            const codigo = fila.cells[1].textContent;
            const nombre = fila.cells[2].textContent;
            alert(`Código: ${codigo}, Nombre: ${nombre}`);
        }
    });
}
</script>
    
</body>

</html>
