<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNIDAD 6 - ACTIVIDAD 7</title>

  <style>
    .seleccionado {
      background-color: lightgray;
    }

    li {
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Lista de elementos</h1>
  <form id="formulario">
    <select id="selectOptions">
      <option value="opcion1">Opción 1</option>
      <option value="opcion2">Opción 2</option>
      <option value="opcion3">Opción 3</option>
    </select>
    <button type="button" id="btnAgregar">Agregar</button>
  </form>
  <ul id="lista">
  </ul>
  <script>
  document.getElementById('btnAgregar').addEventListener('click', () => {
    const select = document.getElementById('selectOptions');
    const valor = select.options[select.selectedIndex].text;
    
    const nuevoLi = document.createElement('li');
    nuevoLi.textContent = valor;
    document.getElementById('lista').appendChild(nuevoLi);
    
    select.selectedIndex = 0; // Limpiar selección
});
  </script>
</body>

</html>
