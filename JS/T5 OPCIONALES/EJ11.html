<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detección de Ratón</title>
    <style>
        #colorBox {
            width: 300px;
            height: 300px;
            background-color: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
            font-weight: bold;
            transition: background-color 0.3s ease;
            cursor: pointer;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="colorBox">PASA EL RATÓN AQUÍ</div>

    <script>
        const box = document.getElementById('colorBox');

        box.addEventListener('mouseenter', () => {
            box.style.backgroundColor = '#2ecc71';
            box.textContent = '¡ENTRASTE!';
        });

        box.addEventListener('mouseleave', () => {
            box.style.backgroundColor = '#3498db';
            box.textContent = 'SALISTE';
        });
    </script>

</body>
</html>
