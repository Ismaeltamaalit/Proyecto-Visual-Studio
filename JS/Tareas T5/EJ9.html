<body>
    <script>
        
const palabras = ["auto", "árbol", "aire", "ala", "aspa", "abuelo", "ante", "amar"];

const regex = /^a.{3}$/i;

const resultado = palabras.filter(palabra => regex.test(palabra));


console.log("Palabras encontradas:", resultado); 

    </script>
</body>
