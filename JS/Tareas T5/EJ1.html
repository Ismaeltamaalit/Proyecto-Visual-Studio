<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solo Letras en Campo de Texto</title>
</head>
<body>

    <h2>Entrada de Texto - Solo Letras</h2>
    <input type="text" id="campoSoloLetras" placeholder="Escribe aquí (solo letras)">

    <p style="margin-top: 15px;">**Instrucción:** Intenta escribir un número en la caja de arriba.</p>

    <script>
        const campo = document.getElementById('campoSoloLetras');

        campo.addEventListener('keydown', function(event) {
            const teclaPresionada = event.key;
            

            const esNumero = /\d/.test(teclaPresionada);


            if (esNumero) {
                event.preventDefault();
                
                
                alert('🚫 ¡Solo se permiten letras en este campo!');
            }
        });
    </script>

</body>
</html>
