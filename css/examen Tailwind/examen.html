<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto</title>
        <script src="https://cdn.tailwindcss.com"></script>
    <link href="./src/output.css" rel="stylesheet">    
    <style>
        /* Estilos CSS adicionales */
        
    </style>
</head>
<body class="bg-slate-800 text-white">
 
    <!-- Encabezado -->
    <header class="pb-5 bg-slate-400">
        <div class="flex items-center justify-between">
            <h1 class="font-extrabold text-3xl hover:text-red-400 cursor-pointer transition-all">Mi pagina</h1>
            <nav class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-6 items-center font-medium 
            ">
                    <a href="#hero" class="hover:text-red-300">Inicio</a>
                    <a href="#producto" class="hover:text-red-300">Producto</a>
                    <a href="#galeria" class="hover:text-red-300">Galeria</a>                 
                    <a href="#contacto" class="hover:text-red-300">Contacto</a>
            </nav>
        </div>
    </header>
 
    <!-- Sección Hero -->
    <section id="hero" class="p-20 flex item-center justify-center px-6 bg-slate-600  ">
        <div class="flex flex-col gap-8 max-w-2xl">
            <h2 class="text-3xl font-bold">Muy buenas, este es el texto</h2>
            <p class="font-medium text-xl text-gray-200">Muy buenas, este es el subtexto</p>
        <button class="bg-red-400 w-fit hover:bg-red-500 text-slate-900 px-8 rounded-full font-bold py-3 transition-all duration-300 hover:scale-105 shadow-lg active:scale-95">botón</button>
        </div>
    </section>
 
    <!-- Video Promocional -->
<section class="py-10 bg-slate-800 text-center">
        <h2 class="text-2xl font-bold mb-6">Video Promocional</h2>
        <div class="max-w-3xl mx-auto px-4">
            <video class="w-full rounded-lg shadow-lg" controls>
                <source src="movie.mp4" type="video/mp4" alt="video que no se ve">
                Tu navegador no soporta la etiqueta de video.
            </video>
        </div>
    </section> 
    <!-- Sección de Productos -->
    <section id="producto" class="py-16 px-6 container mx-auto">
        <h2 class="">text</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="p-6 bg-slate-600 rounded-xl shadow-sm border border-slate-500 text-center transition-all hover:shadow-md hover:-translate-y-1">
                <img src="https://picsum.photos/300/200?random=1" alt="Producto 1" class="w-full h-40 object-cover rounded-lg mb-4">
                <h3 class="text-xl font-semibold mb-2">Producto 1</h3>
                <p class="text-slate-300 mb-4">Descripción breve del producto.</p>
                <button class="bg-red-400 text-slate-900 px-4 py-2 rounded-lg font-bold hover:bg-red-300">Ver más</button>
            </div>
                        <div class="p-6 bg-slate-600 rounded-xl shadow-sm border border-slate-500 text-center transition-all hover:shadow-md hover:-translate-y-1">
                <img src="https://picsum.photos/300/200?random=1" alt="Producto 1" class="w-full h-40 object-cover rounded-lg mb-4">
                <h3 class="text-xl font-semibold mb-2">Producto 1</h3>
                <p class="text-slate-300 mb-4">Descripción breve del producto.</p>
                <button class="bg-red-400 text-slate-900 px-4 py-2 rounded-lg font-bold hover:bg-red-300">Ver más</button>
            </div>
   
        </div>
    </section>
 
    <!-- Galería de Imágenes -->
    <section id="gallery" class="p-20 bg-slate-800">
        <h2 class="font-semibold text-3xl hover:text-red-400">Fotos</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 p-4 container mx-auto overflow-hidden  rounded-lg shadow-md hover:shadow-xl hover:scale-[1.02]">
            <img src="https://picsum.photos/300/200?random=2" class="h-64 w-full object-cover transition duration-300 ease-in-out hover:opacity-75">
            <img src="https://picsum.photos/300/200?random=2" class="h-64 w-full object-cover transition duration-300 ease-in-out hover:opacity-75">
            <img src="https://picsum.photos/300/200?random=2" class="h-64 w-full object-cover transition duration-300 ease-in-out hover:opacity-75">
            <img src="https://picsum.photos/300/200?random=2" class="h-64 w-full object-cover transition duration-300 ease-in-out hover:opacity-75">
 
        </div>
    </section>
 
    <!-- Sección de Contacto -->
    <section id="contacto" class="">
        <h2 class="">Contáctanos</h2>
        <form class="">
            <label class="">Nombre:</label>
            <input type="text" class="">
 
            <label class="">Correo Electrónico:</label>
            <input type="email" class="">
 
            <label class="">Mensaje:</label>
            <textarea class="" rows="4"></textarea>
 
            <button class="">Enviar Mensaje</button>
        </form>
    </section>
 
    <!-- Footer -->
    <footer class="">
        <div class="">
            <p class="">© 2026 texto</p>
            <div class="">
                <a href="#" class="">text</a>
                <a href="#" class="">text</a>
                <a href="#" class="">text</a>
            </div>
        </div>
    </footer>
 
</body>
</html>
