<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <header class="bg-gray-500 text-white">
        <div class="container  px-6 py-4 flex justify-between items-center">
            <img src="imagen.jpeg" alt="Logo" class="h-10">
            <nav class="hidden md:flex space-x-6">
                <a href="#hero" class="hover:text-blue-300 font-medium">Inicio</a>
                <a href="#products" class="hover:text-blue-300 font-medium">Productos</a>
                <a href="#gallery" class="hover:text-blue-300 font-medium">Galeria</a>
                <a href="#contact" class="hover:text-blue-300 font-medium">Contactos</a>
            </nav>
        </div>
    </header>

    <section id="hero" class="bg-blue-50 py-20 px-6 flex flex-col items-center text-center">
        <h1 class="text-4xl font-extrabold text-gray-800">Bienvenido a mi página</h1>
        <div class="max-w-2xl">
            <img src="https://picsum.photos/800/400" alt="Hero Image" class="rounded-lg shadow-lg mt-6 mb-8 w-full h-64 object-cover">
            
        </div>
    </section>

    <section id="products" class="py-16 container mx-auto px-6 flex flex-col">
            <h1 class="text-3xl font-extrabold mb-3">Productos</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">

            <div class="p-6 bg-white rounded-xl shadow-sm border border-gray-200 text-center">
                <div class="mb-3 overflow-hidden rounded-lg">
                    <img src="https://picsum.photos/300/200?random=1" alt="Producto Aleatorio" class="w-full h-40 object-cover">
                </div>
                <h3 class="text-xl font-bold mb-2">Producto </h3>
                <p class="text-gray-500">Descripción detallada del producto.</p>
            </div>

            <div class="p-6 bg-white rounded-xl shadow-sm border border-gray-200 text-center">
                <div class="text-blue-500 text-3xl mb-3 flex justify-center">
                    <img src="https://picsum.photos/300/200?random=1" alt="Producto Aleatorio" class="w-full h-12 w-12 object-cover">
                </div>
                <h3 class="text-xl font-bold mb-2">Nombre</h3>
                <p class="text-gray-500">Descripción del producto.</p>
            </div>

            <div class="p-6 bg-white rounded-xl shadow-sm border border-gray-200 text-center">
                <div class="text-blue-600 text-4xl font-bold mb-3">
                </div>
                <h3 class="text-xl font-bold mb-2">Precio Oferta</h3>
                <span id="random-price">0</span>€

                <p class="text-gray-500">Precio generado aleatoriamente.</p>
            </div>

            <div class="p-6 bg-white rounded-xl shadow-sm border border-gray-200 text-center flex flex-col justify-between">
                <div>
                    <h3 class="text-xl font-bold mb-2">Finalizar Compra</h3>
                    <p class="text-gray-500 mb-4">Añade este artículo a tu carrito.</p>
                </div>
                <button class="w-full bg-green-500 text-white py-2 rounded-lg font-semibold hover:bg-green-600 transition">
                    Comprar ahora
                </button>
            </div> 

        </div>
    </section>

    <section id="gallery" class="py-10 bg-white">
                    <h1 class="text-3xl font-extrabold mb-3">Galeria de Imagenes</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 p-4 container mx-auto">
            <div class="overflow-hidden bg-black rounded-lg">
                <img src="https://picsum.photos/id/10/600/400" alt="Random 1" class="w-full h-64 object-cover transition-opacity duration-300 ease-in-out hover:opacity-75">
            </div>
            <div class="overflow-hidden bg-black rounded-lg">
                <img src="https://picsum.photos/id/20/600/400" alt="Random 2" class="w-full h-64 object-cover transition-opacity duration-300 ease-in-out hover:opacity-75">
            </div>
            <div class="overflow-hidden bg-black rounded-lg">
                <img src="https://picsum.photos/id/30/600/400" alt="Random 3" class="w-full h-64 object-cover transition-opacity duration-300 ease-in-out hover:opacity-75">
            </div>
        </div>
    </section>

<section id="contact" class="py-16 bg-gray-50">
    <div class="container mx-auto px-6 flex justify-center">
        <div class="w-full  bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Contáctanos</h2>
            </div>
            
            <form id="contactForm" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Nombre completo</label>
                    <input type="text" id="name" name="name" 
                        class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
                    <input type="email" id="email" name="email" 
                        class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700">Mensaje</label>
                    <textarea id="message" name="message" rows="4" 
                        class="w-full p-3 rounded-lg border border-gray-300  outline-none"></textarea>
                </div>

                <button type="submit" 
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors">
                    Enviar Mensaje
                </button>
            </form>
        </div>
    </div>
</section>





    <script>
        window.onload = function() {
            const priceElement = document.getElementById('random-price');
            const min = 10;
            const max = 500;
            const randomPrice = Math.floor(Math.random() * (max - min + 1)) + min;
            priceElement.textContent = randomPrice;
        };
    </script>
</body>
</html>
