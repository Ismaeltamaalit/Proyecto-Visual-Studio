<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>VG.BLOG | Contacto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgMain: '#121212',
            bgSecondary: '#1e1e1e',
            textSecondary: '#b3b3b3',
            accent: '#3b82f6'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-bgMain text-white font-sans">

<!-- HEADER -->
<header class="bg-bgSecondary border-b border-neutral-800">
  <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between">
    <h1 class="text-2xl font-bold">VG.BLOG</h1>

    <nav class="mt-3 md:mt-0 flex gap-6 text-textSecondary">
      <a href="index.html" class="hover:text-white">Inicio</a>
      <a href="reviews.html" class="hover:text-white">Reviews</a>
      <a href="noticias.html" class="hover:text-white">Noticias</a>
      <a href="guias.html" class="hover:text-white">Guías</a>
      <a href="contacto.html" class="hover:text-white">Contacto</a>
    </nav>
  </div>
</header>

<main class="max-w-md mx-auto px-6 py-16">
  <h2 class="text-3xl font-bold mb-8">Contacto</h2>

  <form class="space-y-6">
    <input
      type="text"
      placeholder="Nombre"
      class="w-full p-3 rounded bg-bgSecondary text-white border border-neutral-800"
    >

    <input
      type="email"
      placeholder="Email"
      class="w-full p-3 rounded bg-bgSecondary text-white border border-neutral-800"
    >

    <textarea
      placeholder="Mensaje"
      rows="4"
      class="w-full p-3 rounded bg-bgSecondary text-white border border-neutral-800"
    ></textarea>

    <button
      type="submit"
      class="w-full bg-accent py-3 rounded font-semibold hover:opacity-90">
      Enviar mensaje
    </button>
  </form>
</main>

<!-- FOOTER -->
<footer class="bg-bgSecondary border-t border-neutral-800">
  <div class="max-w-6xl mx-auto px-6 py-6 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
    <p class="text-sm text-textSecondary">© vg.blog</p>

    <div class="flex gap-6 text-sm text-textSecondary">
      <a href="#" class="hover:text-white">Política de privacidad</a>
      <a href="#" class="hover:text-white">Términos de uso</a>
    </div>
  </div>
</footer>
</body>
</html>
