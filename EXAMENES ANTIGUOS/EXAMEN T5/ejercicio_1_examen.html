<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Validación de formulario</title>

    <style type="text/css">
      label {
        width: 150px;
        float: left;
        margin-bottom: 5px;
      }

      input,
      select {
        width: 150px;
        float: left;
        margin-bottom: 5px;
      }

      fieldset {
        background: #66cccc;
        width: 350px;
        border: thick solid #306;
      }

      legend {
        border-top-width: medium;
        border-right-width: medium;
        border-bottom-width: medium;
        border-left-width: medium;
        border-top-style: solid;
        border-right-style: solid;
        border-bottom-style: solid;
        border-left-style: solid;
        background-color: #fff;
      }

      #mensajes {
        float: left;
        background: #33ff33;
        width: 325px;
      }

      #errores {
        float: left;
        background: #ff6633;
        width: 325px;
      }

      #intentos {
        float: left;
        background: #ccff33;
        width: 325px;
      }

      .error {
        border: solid 2px #ff0000;
      }
    </style>
  </head>

  <body>
    <fieldset>
      <legend>Validación de formulario</legend>
      <form
        name="formulario"
        id="formulario"
        action="http://www.google.es"
        method="get"
      >
        <label for="fecha">Fecha:</label>
        <input type="text" name="fecha" id="fecha" />
        <label for="hora">Hora:</label>
        <input type="text" name="hora" id="hora" />
        <label for="tipoVehiculo">Tipo de vehículo:</label>
        <select name="tipoVehiculo" id="tipoVehiculo">
          <option value="0" selected="selected">Seleccionar ...</option>
          <option value="TU">Turismo</option>
          <option value="VE">Veh. mixto adaptable</option>
          <option value="FU">Furgoneta</option>
          <option value="MO">Moto</option>
        </select>
        <label for="matricula">Matrícula:</label>
        <input name="matricula" type="text" id="matricula" />
        <label for="correo">Correo electrónico:</label>
        <input name="correo" type="text" id="correo" />
        <label for="nombre">Nombre:</label>
        <input name="nombre" type="text" id="nombre" />
        <label for="condiciones">Acepto condiciones:</label>
        <input type="checkbox" id="condiciones" name="condiciones" />

        <input type="reset" name="limpiar" id="button" value="Limpiar" />
        <input type="submit" name="enviar" id="enviar" value="Enviar" />
<script>
  


</script>
        
      </form>
      <div id="errores"></div>
      <div id="intentos"></div>
    </fieldset>

    <script type="text/javascript" src="/EXAMEN T5/examen-ismael.js"></script>
  </body>
</html>
